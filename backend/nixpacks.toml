[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = ["python3.11 -m pip install --upgrade pip setuptools wheel", "python3.11 -m pip install -r requirements.txt"]

[start]
cmd = "python3.11 manage.py migrate && python3.11 manage.py seed_data && gunicorn breathe_esg.wsgi:application --bind 0.0.0.0:$PORT"
