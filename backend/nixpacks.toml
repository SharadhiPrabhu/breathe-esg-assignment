[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate --run-syncdb && python manage.py seed_data && gunicorn breathe_esg.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
